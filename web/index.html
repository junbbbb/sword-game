<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검 게임</title>
<!-- 빈 아이콘. 안 넣으면 브라우저가 /favicon.ico 를 찾다가 404 를 콘솔에 남긴다
     (게임에는 아무 영향이 없지만 "콘솔 에러 0" 을 보려면 이 한 줄이 필요하다) -->
<link rel="icon" href="data:,">
<!-- ★11차 파도(시스템창 전환)에서 붓 웹폰트 preload 두 줄을 걷어냈다.
     UI 가 활자(시스템 고딕)로 바뀌어서 fonts/rf-brush-*.woff2 를 아무도 안 쓴다.
     preload 만 남겨 두면 463KB 를 받아 놓고 안 쓰는 셈이고 브라우저가 콘솔에
     경고를 남긴다. **파일 자체는 fonts/ 에 그대로 둔다**(다른 데서 참조할 수 있다). -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 로딩 중에는 ui.js 가 아직 없으므로 같은 토큰을 여기에도 독립 정본으로 둔다. */
  :root {
    --rb-panel-a:#fffaf0;
    --rb-panel-b:#f6ecd8;
    --rb-panel-c:#ead5af;
    --rb-deep:#4b321d;
    --rb-ink:#3b2514;
    --rb-line:#5a3d24;
    --rb-line-soft:rgba(181,126,59,.42);
    --rb-txt:#3b2414;
    --rb-dim:#6d4d32;
    --rb-mute:#9a7652;
    --rb-drop:0 1px 0 #fff8e8;
    --rb-drop-lg:0 2px 0 #fff8e8;
    --rb-mint:#f4bb38;
    --rb-gold:#f4b62d;
    --rb-orange:#ef7e24;
    --rb-red:#e94a34;
    --rb-heart:#f25b4b;
    --rb-green:#45d86e;
    --rb-pop:inset 0 0 0 2px #fff8e8,inset 0 0 0 4px #c9954e,0 4px 0 #3b2514,0 12px 22px rgba(59,37,20,.24);
    --rb-pop-sm:inset 0 0 0 1px #fff8e8,inset 0 0 0 3px #cf9b50,0 3px 0 #3b2514,0 7px 14px rgba(59,37,20,.20);
    --rb-token:#f4b62d;
    --rb-ok:#45b966;
  }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--rb-panel-c);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif; }
  #cv { display:block; width:100%; height:100%; }
  .hud { position:fixed; color:var(--rb-dim);
    user-select:none; pointer-events:none; }

  /* ── 조작 안내 ──────────────────────────────────────────────────────────
     ★키캡 열에는 **진짜 키만** 넣는다(v93 판정 S8). 예전에는 「수풀」「마우스 휠」이
       키캡 모양을 하고 있어서 "수풀이라는 키가 있나" 로 읽혔다. 키가 아닌 것은
       맨 아래 주석 줄로 내렸다.
     ★키 열은 오른쪽 정렬 고정폭이다. 왼쪽 정렬로 두면 캡 길이가 제각각이라
       설명 글이 계단처럼 어긋난다. */
  #help { left:16px; top:14px; font-size:13px; line-height:1.6; }
  #help .hRow { display:flex; align-items:baseline; gap:9px; padding:1px 0; }
  /* ★키 열 폭은 **가장 긴 줄**(「이동+ [Space]」)에 맞춘다. 모자라면 그 줄만 왼쪽으로
       삐져나와 판 밖으로 흐른다(flex-basis 고정이라 줄어들지도 늘어나지도 않는다).
     ★nowrap: 좁은 창에서 키캡 글자가 「Spa / ce」로 접히는 것을 막는다. */
  #help .ks { flex:0 0 106px; display:flex; gap:4px; justify-content:flex-end;
    white-space:nowrap; }
  /* ★키캡은 아이보리 면 + 월넛 테 + 둥근 모서리다.
       진짜 값은 ui.js 가 나중에 덮는다. 여기 한 벌은 ui.js 가 붙기 전 한 프레임을 위한 것이다 */
  #help .k { display:inline-block; min-width:24px; padding:1px 7px 2px;
    border:2px solid #8c6237; border-radius:7px; background:var(--rb-panel-a);
    box-shadow:0 2px 0 #c89756; color:var(--rb-txt); font-size:12px;
    font-weight:700; text-align:center; white-space:nowrap; }
  /* 캡 곁의 비-키 글자. 캡 사이의 「~」, 캡 앞의 「이동+」가 여기 속한다 */
  #help .kx { color:var(--rb-mute); font-size:12px; white-space:nowrap; }
  #help .t { color:var(--rb-txt); }
  #help .t b { color:var(--rb-txt); font-weight:800; }
  #help .hSep { height:2px; border-radius:1px; margin:7px 4px 8px 0;
    background:var(--rb-line-soft); }
  #help .hNote { color:var(--rb-mute); font-size:12px; line-height:1.55; padding-left:2px; }

  #sword { right:16px; bottom:18px; font-size:15px; font-weight:800;
    color:var(--rb-txt); transition:opacity .25s; }
  #stat { right:16px; top:14px; font-size:12px; text-align:right;
    color:var(--rb-mute); line-height:1.7; }
  #stat span { color:var(--rb-dim); }
  #combo { position:fixed; left:50%; top:20%; transform:translateX(-50%);
    font-size:44px; font-weight:800; white-space:nowrap; color:var(--rb-panel-a);
    text-shadow:0 3px 0 #c9913e,0 6px 7px rgba(59,37,20,.28);
    opacity:0; letter-spacing:1px; }

  /* ── 로딩 진행 셸 ───────────────────────────────────────────────────────
     ★예전에는 「불러오는 중…」 정지 글자 하나였다(v93 판정). 십수 MB 를 받는 동안
       화면이 얼어 있는 것과 구분이 안 된다. 진행 트랙 + 퍼센트로 바꾼다.
     ★첫 화면부터 같은 문법이어야 입장 알림창까지 한 덩어리로 읽힌다.
       그래서 진행 트랙을 **카드 안에** 넣는다.
     ★★이 판의 CSS 를 ui.js 와 나눠 쓸 수 없다. ui.js 는 main.js 맨 끝에서 붙는데
       로딩 화면은 그보다 먼저 떠 있어야 하기 때문이다. 그래서 같은 문법을 여기
       한 벌 더 적는다(로딩 화면의 정본은 이 블록이다). 색을 바꿀 때는 ui.js 의
       :root 토큰과 **같이** 바꿀 것 - 안 그러면 로딩과 게임의 판 색이 갈린다.
     ★13차 키트 값은 위 :root 에 ui.js 와 1:1로 둔다. */
  #load { position:fixed; inset:0; display:flex; align-items:center;
    justify-content:center; background:radial-gradient(circle at 50% 42%,#fff8e8,var(--rb-panel-c)); z-index:9; }
  /* 판: 메이플 창 크롬 - 네이비 타이틀 띠 + 놋쇠 실선 + 아이보리 몸통 + 미세 결.
     ★14차. ui.js 의 창 규칙과 **같은 값**이어야 한다(띠 36px · 놋쇠 3px · 결 3px 주기).
       로딩 화면은 여기가 정본이라, ui.js 쪽을 고칠 때 이 블록도 같이 고칠 것. */
  #load .win { position:relative; padding:52px 38px 26px; border-radius:22px;
    background:
      linear-gradient(180deg,#4a4571 0%,#332e52 100%) no-repeat left top / 100% 36px,
      repeating-linear-gradient(0deg,rgba(122,86,45,.030) 0 1px,rgba(255,255,255,0) 1px 3px),
      linear-gradient(180deg,var(--rb-panel-a),var(--rb-panel-b) 68%,var(--rb-panel-c));
    border:3px solid var(--rb-line); box-shadow:var(--rb-pop); }
  /* 놋쇠 실선. 띠와 몸통 사이 한 겹 */
  #load .fr { position:absolute; left:0; right:0; top:33px; height:3px;
    pointer-events:none; border-radius:0;
    background:linear-gradient(90deg,rgba(201,149,78,0),#e8bf6d 18%,#f7dda2 50%,#e8bf6d 82%,rgba(201,149,78,0)); }
  /* 카드 왼쪽 변에 걸친 원형 배지 */
  #load .hd { display:block; text-align:center; }
  #load .hd .ic { position:absolute; left:-34px; top:50%; margin-top:-32px;
    width:64px; height:64px; border-radius:50%; font-style:normal;
    border:3px solid var(--rb-line);
    background:radial-gradient(circle at 42% 34%,#fffdf5 0%,#f8e4bd 54%,#dda95e 100%);
    color:var(--rb-txt); font-weight:800; font-size:25px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--rb-pop-sm); }
  /* 창 이름. 띠 안에 눕는다 */
  #load .hd b { position:absolute; left:0; right:0; top:0; z-index:2;
    height:33px; line-height:34px; text-align:center;
    font-weight:800; font-size:12px; letter-spacing:.16em;
    padding-left:.16em; color:#efe6ff; text-shadow:0 1px 0 rgba(18,14,34,.6); }
  #load .bd { padding-top:0; display:flex; flex-direction:column;
    align-items:center; gap:12px; }
  #load .ldTrack { position:relative; width:min(300px,54vw); height:14px;
    border-radius:999px; border:3px solid var(--rb-line); background:var(--rb-deep);
    overflow:hidden; }
  #load .ldFill { position:absolute; left:0; top:0; bottom:0; width:100%;
    transform:scaleX(0); transform-origin:0 50%; border-radius:6px;
    background:linear-gradient(180deg,#8bf19f,var(--rb-green) 55%,#28ae55);
    transition:transform .28s cubic-bezier(.22,.8,.3,1); }
  #load .ldPct { font-size:13px; font-weight:800; letter-spacing:.02em;
    color:var(--rb-txt); font-variant-numeric:tabular-nums; text-shadow:none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="load">
  <div class="win">
    <i class="fr"></i>
    <div class="hd"><i class="ic">!</i><b>불러오는 중</b></div>
    <div class="bd">
      <div class="ldTrack"><i class="ldFill"></i></div>
      <div class="ldPct">0%</div>
    </div>
  </div>
</div>
<div class="hud" id="help">
  <!-- ★조사는 앞말에 붙여 쓴다(판정 S13). 「WASD 도 됨」은 띄어쓰기가 틀렸고
       「됨」으로 끝나서 서술이 안 닫힌다. 다른 줄과 같은 동작형으로 맞춘다. -->
  <div class="hRow"><span class="ks"><span class="k">방향키</span></span><span class="t">이동 (WASD로도 가능)</span></div>
  <div class="hRow"><span class="ks"><span class="k">Shift</span></span><span class="t">달리기</span></div>
  <!-- ★Space 한 키가 두 동작이다(방향 입력 유무로 갈린다). 안내도 두 줄로 가른다.
       「이동+」는 키가 아니라 조건이라 키캡을 안 씌우고 .kx 로 둔다. -->
  <div class="hRow"><span class="ks"><span class="k">Space</span></span><span class="t">점프 (제자리)</span></div>
  <!-- ★「쿨」은 게임 은어다(판정 S13). 이 안내는 처음 켠 사람이 읽는 자리라
       한 번에 뜻이 서는 말이어야 한다. -->
  <div class="hRow"><span class="ks"><span class="kx">이동+</span><span class="k">Space</span></span><span class="t">회피 (재사용 1.2초)</span></div>
  <div class="hSep"></div>
  <div class="hRow"><span class="ks"><span class="k">Z</span></span><span class="t">베기, 연속으로 3연타</span></div>
  <div class="hRow"><span class="ks"><span class="k">X</span></span><span class="t">수면참, 크게 한 번</span></div>
  <div class="hRow"><span class="ks"><span class="k">C</span></span><span class="t">횡일섬, 가로로 넓게</span></div>
  <div class="hSep"></div>
  <div class="hRow"><span class="ks"><span class="k">1</span><span class="kx">~</span><span class="k">7</span></span><span class="t">칼 교체 (Tab으로 순환)</span></div>
  <!-- F(캐릭터 교체)는 개발용이다. 평시에는 캐릭터가 검사 하나뿐이라 이 줄이 거짓말이 된다.
       기본은 숨김이고 main.js 가 ?dev 일 때만 켠다(숨김을 CSS 로 박아 두면 첫 프레임에
       깜빡 보였다 사라지는 일이 없다). -->
  <div class="hRow" id="hFchar" style="display:none"><span class="ks"><span class="k">F</span></span><span class="t">캐릭터 교체 (개발용)</span></div>
  <div class="hRow"><span class="ks"><span class="k">R</span></span><span class="t">제자리로, 층 재시작</span></div>
  <div class="hRow"><span class="ks"><span class="k">H</span></span><span class="t">이 안내 접기 / 펼치기</span></div>
  <!-- ★main.js 가 이 줄의 innerHTML 을 통째로 다시 쓴다(소리 켜짐 / 꺼짐).
       ui.js 가 그 뒤에 「소리 끄기 / 켜기」 동작형으로 다시 맞춘다. -->
  <div class="hRow" id="mute"><span class="ks"><span class="k">M</span></span><span class="t">소리 끄기</span></div>
  <div class="hSep"></div>
  <div class="hNote">마우스 휠로 줌. 시점은 고정 쿼터뷰.</div>
  <div class="hNote">수풀에 들어가면 숨는다. 달리거나 베면 들킨다.</div>
</div>
<div class="hud" id="stat"></div>
<div class="hud" id="sword"></div>
<div id="combo"></div>
<script>
// ── 로딩 진행 창구 ─────────────────────────────────────────────────────────
// ★이 스크립트는 **모듈보다 먼저** 돈다. 그래서 main.js 는 첫 바이트를 받은 순간부터
//   window.__loadProgress(0~1) 을 부를 수 있다(ui.js 는 로딩이 끝난 뒤에 붙으므로
//   거기에만 두면 로딩 중에는 존재하지 않는다). ui.js 는 이미 있으면 안 덮는다.
// ★진짜 진행값이 안 오는 동안에도 막대는 움직여야 한다. 1.2초 안에 아무 호출이
//   없으면 90% 를 점근선으로 삼는 가짜 크리프를 돌리고, 진짜 값이 오면 즉시 넘긴다.
(function () {
  var el = document.getElementById('load');
  var fill = el.querySelector('.ldFill');
  var pct = el.querySelector('.ldPct');
  var shown = 0, real = -1, creep = 0, t0 = Date.now(), timer = 0;

  function paint(v) {
    if (v <= shown) return;                     // 진행은 뒤로 안 간다
    shown = v;
    fill.style.transform = 'scaleX(' + v.toFixed(3) + ')';
    pct.textContent = Math.round(v * 100) + '%';
  }
  function tick() {
    if (real >= 0) return;                      // 진짜 값이 오면 크리프는 은퇴한다
    var s = (Date.now() - t0) / 1000;
    creep = 0.90 * (1 - Math.exp(-s / 7));      // 점근선 90%
    paint(creep);
    timer = setTimeout(tick, 160);
  }
  // ★300ms. 예전 값(1200)에서는 첫 1.2초 동안 막대가 0% 에 얼어 있어서
  //   "멈춘 화면" 으로 읽혔다(첫 시안 촬영에서 잡았다). 진짜 값이 오면 어차피 넘긴다.
  timer = setTimeout(tick, 300);

  window.__loadProgress = function (v) {
    v = Math.max(0, Math.min(1, +v || 0));
    real = v;
    clearTimeout(timer);
    paint(v);
  };

  // main.js 가 로딩 화면을 감추면 크리프 타이머를 거둔다(안 거두면 판이 도는 내내
  // 160ms 짜리 타이머가 남는다). 막대도 100% 로 못박아 둔다.
  new MutationObserver(function () {
    if (el.style.display !== 'none') return;
    clearTimeout(timer);
    paint(1);
  }).observe(el, { attributes: true, attributeFilter: ['style'] });
})();
</script>
<!-- 페이지 쿼리(?v=..)를 모듈에도 물려준다. 안 그러면 index.html 만 새로 받고
     main.js 는 캐시된 옛날 것이 돌아서 고친 게 반영 안 된 것처럼 보인다. -->
<script type="module">import('./main.js' + location.search);</script>
</body>
</html>
