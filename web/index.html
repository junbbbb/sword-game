<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>탑의 생존자 · 전투 데모</title>
<!-- 빈 아이콘. 안 넣으면 브라우저가 /favicon.ico 를 찾다가 404 를 콘솔에 남긴다
     (게임에는 아무 영향이 없지만 "콘솔 에러 0" 을 보려면 이 한 줄이 필요하다) -->
<link rel="icon" href="data:,">
<!-- UI 스킨은 게임 로직과 분리한다. 두 시안을 함께 두고 data-ui-theme 값 한 줄로
     전환한다. 자세한 규칙: docs/ui-theme-guide.md -->
<link rel="stylesheet" href="./ui-theme-abyss.css">
<link rel="stylesheet" href="./ui-theme-bronze.css">
<!-- 19차 마감 겹. 독립 테마가 아니라 Bronze Story 위에 얹는 덧겹이라
     body 의 data-ui-theme 는 그대로 두고 data-ui-frame 만 더 받는다.
     되돌리기 = body 에서 data-ui-frame="vine" 한 토막을 지운다. -->
<link rel="stylesheet" href="./ui-theme-vine.css">
<link rel="preload" href="./ui-assets/fonts/Paperlogy-7Bold.woff2"
      as="font" type="font/woff2" crossorigin>
<!-- ★11차 파도(시스템창 전환)에서 붓 웹폰트 preload 두 줄을 걷어냈다.
     UI 가 활자(시스템 고딕)로 바뀌어서 fonts/rf-brush-*.woff2 를 아무도 안 쓴다.
     preload 만 남겨 두면 463KB 를 받아 놓고 안 쓰는 셈이고 브라우저가 콘솔에
     경고를 남긴다. **파일 자체는 fonts/ 에 그대로 둔다**(다른 데서 참조할 수 있다). -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* ★로딩 중에는 ui.js 가 아직 없으므로 같은 토큰을 여기에도 **독립 정본**으로 둔다.
     ui.js 의 :root 를 고칠 때 이 블록도 **같이** 고칠 것 - 안 그러면 로딩 화면과
     게임 화면의 판 색이 갈린다. 16차 값(롤+SAO+메이플 블렌드)으로 맞춰 놓았다. */
  :root {
    --ui-glass:rgba(13,20,36,.90);
    --ui-glass-2:rgba(7,12,23,.94);
    --ui-deep:#05080f;
    --ui-edge:rgba(196,230,255,.34);
    --ui-edge-on:rgba(120,224,255,.78);
    --ui-hair:rgba(255,255,255,.09);
    --ui-txt:#eaf4ff;
    --ui-dim:#9fb4cc;
    --ui-mute:#63788e;
    --ui-cy:#56d8ff;
    --ui-cy-dim:#2f86a6;
    --ui-gold:#ffbb3d;
    --ui-red:#ff5a4a;
    --ui-green:#3ddc84;
    --ui-drop:0 8px 22px rgba(0,0,0,.55);
  }
  html,body { width:100%; height:100%; overflow:hidden; background:#05080f;
    font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif; }
  #cv { display:block; width:100%; height:100%; }
  .hud { position:fixed; color:var(--ui-dim);
    user-select:none; pointer-events:none; }

  /* ── 조작 안내 ──────────────────────────────────────────────────────────
     ★키캡 열에는 **진짜 키만** 넣는다(v93 판정 S8). 예전에는 「수풀」「마우스 휠」이
       키캡 모양을 하고 있어서 "수풀이라는 키가 있나" 로 읽혔다. 키가 아닌 것은
       맨 아래 주석 줄로 내렸다.
     ★키 열은 오른쪽 정렬 고정폭이다. 왼쪽 정렬로 두면 캡 길이가 제각각이라
       설명 글이 계단처럼 어긋난다. */
  /* ★★17차: 판의 모든 치수를 글자 크기 하나(--hf)에 매단다. 16차는 전부 px 못박기라
       창이 작아져도 판만 그대로였다(1100 폭에서 화면의 24% x 47.9%).
       ★ui.js 에 **같은 식**이 한 벌 더 있다(그쪽이 나중에 붙어 이긴다). 값을 고치면
         두 곳을 같이 고칠 것 - 로딩 화면과 같은 이유로 이 판도 정본이 두 벌이다. */
  #help { left:clamp(10px,1.06vw,16px); top:clamp(10px,1.47vh,14px);
    font-size:clamp(10.4px,min(.68vw + 4.2px,1.45vh + 1.2px),13px); line-height:1.5; }
  #help .hRow { display:flex; align-items:baseline; gap:.62em; padding:0; }
  /* ★키 열 폭은 **가장 긴 줄**(회피를 걷은 뒤로는 「방향키」 캡 하나)에 맞춘다. 모자라면
       그 줄만 왼쪽으로 삐져나와 판 밖으로 흐른다(flex-basis 고정이라 줄지도 늘지도 않는다).
     ★nowrap: 좁은 창에서 키캡 글자가 「Spa / ce」로 접히는 것을 막는다.
     ★ui.js 에 같은 값이 한 벌 더 있다(그쪽이 나중에 붙어 이긴다). 고치면 둘 다 고칠 것. */
  #help .ks { flex:0 0 5em; display:flex; gap:.3em; justify-content:flex-end;
    white-space:nowrap; }
  /* ★키캡은 어두운 유리 + 시안 헤어라인이다.
       진짜 값은 ui.js 가 나중에 덮는다. 여기 한 벌은 ui.js 가 붙기 전 한 프레임을 위한 것이다 */
  #help .k { display:inline-block; min-width:1.9em; padding:1px .5em 2px;
    border:0; background:rgba(20,30,50,.92);
    box-shadow:inset 0 0 0 1px rgba(160,210,255,.42); color:var(--ui-txt); font-size:.92em;
    font-weight:700; text-align:center; white-space:nowrap; }
  /* 캡 곁의 비-키 글자. 캡 사이의 「~」, 캡 앞의 「이동+」가 여기 속한다 */
  #help .kx { color:var(--ui-mute); font-size:.92em; white-space:nowrap; }
  #help .t { color:var(--ui-dim); }
  #help .t b { color:var(--ui-txt); font-weight:800; }
  #help .hSep { height:1px; margin:.5em .3em .55em 0;
    background:linear-gradient(90deg,rgba(120,205,255,.34),rgba(120,205,255,0)); }
  #help .hNote { color:var(--ui-mute); font-size:.92em; line-height:1.45; padding-left:2px; }

  #sword { right:16px; bottom:18px; font-size:15px; font-weight:800;
    color:var(--ui-txt); transition:opacity .25s; }
  #stat { right:16px; top:14px; font-size:12px; text-align:right;
    color:var(--ui-mute); line-height:1.7; }
  #stat span { color:var(--ui-dim); }
  #combo { position:fixed; left:50%; top:20%; transform:translateX(-50%);
    font-size:44px; font-weight:800; white-space:nowrap; color:#eaf6ff;
    text-shadow:0 0 18px rgba(86,216,255,.55),0 2px 6px rgba(0,0,0,.7);
    opacity:0; letter-spacing:1px; }

  /* ── 로딩 진행 셸 ───────────────────────────────────────────────────────
     ★예전에는 「불러오는 중…」 정지 글자 하나였다(v93 판정). 십수 MB 를 받는 동안
       화면이 얼어 있는 것과 구분이 안 된다. 진행 트랙 + 퍼센트로 바꾼다.
     ★첫 화면부터 같은 문법이어야 입장 알림창까지 한 덩어리로 읽힌다.
       그래서 진행 트랙을 **카드 안에** 넣는다.
     ★★이 판의 CSS 를 ui.js 와 나눠 쓸 수 없다. ui.js 는 main.js 맨 끝에서 붙는데
       로딩 화면은 그보다 먼저 떠 있어야 하기 때문이다. 그래서 같은 문법을 여기
       한 벌 더 적는다(로딩 화면의 정본은 이 블록이다). 색을 바꿀 때는 ui.js 의
       :root 토큰과 **같이** 바꿀 것 - 안 그러면 로딩과 게임의 판 색이 갈린다.
     ★13차 키트 값은 위 :root 에 ui.js 와 1:1로 둔다. */
  #load { position:fixed; inset:0; display:flex; align-items:center;
    justify-content:center;
    background:radial-gradient(ellipse at 50% 42%,#101c33 0%,#05080f 76%); z-index:9; }
  /* ── 컷코너 한 벌 (ui.js 의 같은 이름 블록과 1:1) ──────────────────────────
     ★★테는 box-shadow:inset 으로 그리는데 그 겹은 **네모**다. 그 위에 45도를
       잘라 내면 잘린 자리에 테가 안 남는다 - 판마다 빗변 넷이 통째로 비어서
       테가 네 도막으로 끊겨 보였다. 빗변은 45도 그러데이션 배경 겹으로 직접 깐다
       (바깥 절반은 clip-path 가 도로 자르므로 남는 두께는 --cw 한 겹). */
  #load .win, #load .ldTrack {
    --cw:1px;
    --cut-ink:var(--ui-edge-on);
    --cut-lines:
      linear-gradient(135deg,rgba(0,0,0,0) calc(50% - var(--cw)),
        var(--cut-ink) calc(50% - var(--cw)) calc(50% + var(--cw)),
        rgba(0,0,0,0) calc(50% + var(--cw))) no-repeat 0 0/var(--c,0px) var(--c,0px),
      linear-gradient(45deg,rgba(0,0,0,0) calc(50% - var(--cw)),
        var(--cut-ink) calc(50% - var(--cw)) calc(50% + var(--cw)),
        rgba(0,0,0,0) calc(50% + var(--cw))) no-repeat 100% 0/var(--c,0px) var(--c,0px),
      linear-gradient(45deg,rgba(0,0,0,0) calc(50% - var(--cw)),
        var(--cut-ink) calc(50% - var(--cw)) calc(50% + var(--cw)),
        rgba(0,0,0,0) calc(50% + var(--cw))) no-repeat 0 100%/var(--c,0px) var(--c,0px),
      linear-gradient(135deg,rgba(0,0,0,0) calc(50% - var(--cw)),
        var(--cut-ink) calc(50% - var(--cw)) calc(50% + var(--cw)),
        rgba(0,0,0,0) calc(50% + var(--cw))) no-repeat 100% 100%/var(--c,0px) var(--c,0px);
    clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),
                      100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,
                      var(--c) 100%,0 calc(100% - var(--c)),0 var(--c)); }
  /* 판: ui.js 의 창 규칙과 **같은 값**이어야 한다 - 어두운 유리 + 1px 시안 헤어라인 +
     컷코너 14px + 위 가운데 시안 막대·실선·삼각 노치.
     ★로딩 화면은 여기가 정본이라, ui.js 쪽을 고칠 때 이 블록도 같이 고칠 것. */
  #load .win { position:relative; padding:70px 44px 30px;
    --c:14px; --cw:1.5px;
    background:
      var(--cut-lines),
      repeating-linear-gradient(0deg,rgba(120,190,255,.030) 0 1px,rgba(0,0,0,0) 1px 4px),
      linear-gradient(180deg,var(--ui-glass) 0%,var(--ui-glass-2) 100%);
    border:0;
    box-shadow:inset 0 0 0 1.5px var(--ui-edge-on),inset 0 0 40px rgba(60,150,220,.10);
    filter:drop-shadow(0 0 14px rgba(86,216,255,.26)) drop-shadow(0 10px 26px rgba(0,0,0,.62)); }
  /* 위 가운데 시안 막대 + 그 아래 얇은 실선 */
  #load .fr { position:absolute; left:0; right:0; top:0; height:34px;
    pointer-events:none; border-radius:0;
    background:
      linear-gradient(90deg,rgba(86,216,255,0),var(--ui-cy) 22%,var(--ui-cy) 78%,rgba(86,216,255,0))
        no-repeat 50% 0 / 132px 3px,
      linear-gradient(90deg,rgba(86,216,255,0),rgba(120,205,255,.42) 30%,
        rgba(120,205,255,.42) 70%,rgba(86,216,255,0)) no-repeat 50% 33px / 100% 1px; }
  /* 삼각 노치. ui.js 카드와 같은 자리·같은 크기 */
  #load .win::after { content:''; position:absolute; left:50%; top:34px; margin-left:-7px;
    width:0; height:0; pointer-events:none;
    border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:7px solid var(--ui-cy); opacity:.9; }
  /* 13차의 원 뱃지는 이 벌에 없다(유리창에는 스티커가 안 붙는다) */
  #load .hd { display:block; text-align:center; }
  #load .hd .ic { display:none; }
  /* 창 이름. 위 실선 바로 밑에 앉는다 */
  #load .hd b { position:absolute; left:0; right:0; top:44px; z-index:2;
    line-height:1; text-align:center;
    font-weight:800; font-size:12px; letter-spacing:.22em;
    padding-left:.22em; color:var(--ui-cy); text-shadow:0 0 10px rgba(86,216,255,.55); }
  #load .bd { padding-top:0; display:flex; flex-direction:column;
    align-items:center; gap:13px; }
  /* ★테는 트랙이 아니라 **덮개(::after)** 가 진다. inset 그림자는 자식 밑에 깔려서,
       막대가 100% 로 차면 트랙의 1px 테가 통째로 채움 밑에 묻혔다(다 찬 순간
       테가 사라진다). 덮개는 채움보다 위라 언제나 남는다 - 빗변도 여기 얹는다. */
  #load .ldTrack { position:relative; width:min(300px,54vw); height:13px;
    --c:4px; --cut-ink:rgba(150,205,245,.40);
    border:0; background:rgba(2,5,11,.94); overflow:hidden; }
  #load .ldTrack::after { content:''; position:absolute; inset:0; z-index:2;
    pointer-events:none; background:var(--cut-lines);
    box-shadow:inset 0 0 0 1px rgba(150,205,245,.40); }
  #load .ldFill { position:absolute; left:0; top:0; bottom:0; width:100%;
    transform:scaleX(0); transform-origin:0 50%; border-radius:0;
    background:linear-gradient(180deg,#9beeff,var(--ui-cy) 45%,#1f9dc4);
    transition:transform .28s cubic-bezier(.22,.8,.3,1); }
  #load .ldPct { font-size:13px; font-weight:800; letter-spacing:.02em;
    color:var(--ui-txt); font-variant-numeric:tabular-nums; text-shadow:none; }
</style>
</head>
<body data-ui-theme="bronze-story" data-ui-frame="vine">
<canvas id="cv"></canvas>
<div id="load">
  <div class="win">
    <i class="fr"></i>
    <div class="hd"><i class="ic">!</i><b>모험 준비 중</b></div>
    <div class="bd">
      <div class="ldMeta"><span>TOWER CHRONICLE</span><span>DEMO BUILD</span></div>
      <div class="ldTrack"><i class="ldFill"></i></div>
      <div class="ldPct">0%</div>
    </div>
  </div>
</div>
<div class="hud" id="help">
  <!-- ★조사는 앞말에 붙여 쓴다(판정 S13). 「WASD 도 됨」은 띄어쓰기가 틀렸고
       「됨」으로 끝나서 서술이 안 닫힌다. 다른 줄과 같은 동작형으로 맞춘다. -->
  <div class="hRow"><span class="ks"><span class="k">방향키</span></span><span class="t">이동 (WASD로도 가능)</span></div>
  <div class="hRow"><span class="ks"><span class="k">Shift</span></span><span class="t">달리기</span></div>
  <!-- ★17차(오너 지시): 회피를 잠갔다(main.js DASH_ON). Space 한 키가 두 동작으로
       갈리던 시절의 두 줄(「점프 (제자리)」 · 「이동+ Space · 회피」)을 한 줄로 합친다.
       이제 이동 중이든 아니든 Space 는 점프 하나라, 조건을 말할 것이 없다. -->
  <div class="hRow"><span class="ks"><span class="k">Space</span></span><span class="t">점프</span></div>
  <div class="hSep"></div>
  <div class="hRow"><span class="ks"><span class="k">Z</span></span><span class="t">베기, 연속으로 3연타</span></div>
  <div class="hRow"><span class="ks"><span class="k">X</span></span><span class="t">수면참, 크게 한 번</span></div>
  <div class="hRow"><span class="ks"><span class="k">C</span></span><span class="t">횡일섬, 가로로 넓게</span></div>
  <div class="hSep"></div>
  <div class="hRow"><span class="ks"><span class="k">1</span><span class="kx">~</span><span class="k">7</span></span><span class="t">칼 교체 (Tab으로 순환)</span></div>
  <!-- F(캐릭터 교체)는 개발용이다. 평시에는 캐릭터가 검사 하나뿐이라 이 줄이 거짓말이 된다.
       기본은 숨김이고 main.js 가 ?dev 일 때만 켠다(숨김을 CSS 로 박아 두면 첫 프레임에
       깜빡 보였다 사라지는 일이 없다). -->
  <div class="hRow" id="hFchar" style="display:none"><span class="ks"><span class="k">F</span></span><span class="t">캐릭터 교체 (개발용)</span></div>
  <div class="hRow"><span class="ks"><span class="k">R</span></span><span class="t">제자리로, 층 재시작</span></div>
  <div class="hRow"><span class="ks"><span class="k">H</span></span><span class="t">이 안내 접기 / 펼치기</span></div>
  <!-- ★main.js 가 이 줄의 innerHTML 을 통째로 다시 쓴다(소리 켜짐 / 꺼짐).
       ui.js 가 그 뒤에 「소리 끄기 / 켜기」 동작형으로 다시 맞춘다. -->
  <div class="hRow" id="mute"><span class="ks"><span class="k">M</span></span><span class="t">소리 끄기</span></div>
  <div class="hSep"></div>
  <div class="hNote">마우스 휠로 줌. 시점은 고정 쿼터뷰.</div>
  <div class="hNote">수풀에 들어가면 숨는다. 달리거나 베면 들킨다.</div>
</div>
<div class="hud" id="stat"></div>
<div class="hud" id="sword"></div>
<div id="combo"></div>
<script>
// ── 로딩 진행 창구 ─────────────────────────────────────────────────────────
// ★이 스크립트는 **모듈보다 먼저** 돈다. 그래서 main.js 는 첫 바이트를 받은 순간부터
//   window.__loadProgress(0~1) 을 부를 수 있다(ui.js 는 로딩이 끝난 뒤에 붙으므로
//   거기에만 두면 로딩 중에는 존재하지 않는다). ui.js 는 이미 있으면 안 덮는다.
// ★진짜 진행값이 안 오는 동안에도 막대는 움직여야 한다. 1.2초 안에 아무 호출이
//   없으면 90% 를 점근선으로 삼는 가짜 크리프를 돌리고, 진짜 값이 오면 즉시 넘긴다.
(function () {
  var el = document.getElementById('load');
  var fill = el.querySelector('.ldFill');
  var pct = el.querySelector('.ldPct');
  var shown = 0, real = -1, creep = 0, t0 = Date.now(), timer = 0;

  function paint(v) {
    if (v <= shown) return;                     // 진행은 뒤로 안 간다
    shown = v;
    fill.style.transform = 'scaleX(' + v.toFixed(3) + ')';
    pct.textContent = Math.round(v * 100) + '%';
  }
  function tick() {
    if (real >= 0) return;                      // 진짜 값이 오면 크리프는 은퇴한다
    var s = (Date.now() - t0) / 1000;
    creep = 0.90 * (1 - Math.exp(-s / 7));      // 점근선 90%
    paint(creep);
    timer = setTimeout(tick, 160);
  }
  // ★300ms. 예전 값(1200)에서는 첫 1.2초 동안 막대가 0% 에 얼어 있어서
  //   "멈춘 화면" 으로 읽혔다(첫 시안 촬영에서 잡았다). 진짜 값이 오면 어차피 넘긴다.
  timer = setTimeout(tick, 300);

  window.__loadProgress = function (v) {
    v = Math.max(0, Math.min(1, +v || 0));
    real = v;
    clearTimeout(timer);
    paint(v);
  };

  // main.js 가 로딩 화면을 감추면 크리프 타이머를 거둔다(안 거두면 판이 도는 내내
  // 160ms 짜리 타이머가 남는다). 막대도 100% 로 못박아 둔다.
  new MutationObserver(function () {
    if (el.style.display !== 'none') return;
    clearTimeout(timer);
    paint(1);
  }).observe(el, { attributes: true, attributeFilter: ['style'] });
})();
</script>
<!-- 페이지 쿼리(?v=..)를 모듈에도 물려준다. 안 그러면 index.html 만 새로 받고
     main.js 는 캐시된 옛날 것이 돌아서 고친 게 반영 안 된 것처럼 보인다. -->
<script type="module">import('./main.js' + location.search);</script>
</body>
</html>
